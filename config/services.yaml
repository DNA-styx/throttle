# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.name: 'Throttle'
    app.login_link_lifetime: 600
    app.admins_default: ''
    app.admins: '%env(default:app.admins_default:APP_ADMINS)%'
    app.symbol_upload_token: '%env(SYMBOL_UPLOAD_TOKEN)%'
    app.legacy:
        accelerator: ''
        apikey: false
        maintenance: ''
        show-version: false
        symbol-stores: ['public']
        symbol-request:
            deny-path-prefixes: ['/usr/lib/', '/lib/', '/usr/local/lib/', '/lib32/', '/lib64/']
            deny-path-contains: ['/.steam/', '/i386-linux-gnu/', '/x86_64-linux-gnu/']
            deny-exact: ['steamclient.so', 'linux-gate.so', 'ld-linux.so.2']
            deny-prefixes: ['lib']
            deny-suffixes: ['_srv.so']
            allow-path-contains: ['/addons/sourcemod/', '/addons/metamod/', '/addons/', '/extensions/', '/plugins/']
            allow-exact: ['srcds_linux']
            allow-regex: ['/^.*\.ext(?:\.[^.]+)*\.so$/', '/^(sourcemod|sourcepawn|metamod|crashhandler)\b.*\.so$/']

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Silex/'
            - '../src/Throttle/'

    Throttle\Command\:
        resource: '../src/Throttle/Command/'
        autowire: true
        autoconfigure: true

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Security\UserManager:
        arguments:
            $loginLinkLifetime: '%app.login_link_lifetime%'

    App\Security\ConfigAdminChecker:
        arguments:
            $adminUsers: '%app.admins%'

    # this isn't quite correct, but it works for now
    App\Security\SteamOpenIdAuthenticator:
        arguments:
            $successHandler: '@security.authentication.success_handler.main.login_link'
            $failureHandler: '@security.authentication.failure_handler.main.login_link'
            $steamApiKey: '%env(STEAM_API_KEY)%'

    App\Security\GitHubOAuthAuthenticator:
        arguments:
            $successHandler: '@security.authentication.success_handler.main.login_link'
            $failureHandler: '@security.authentication.failure_handler.main.login_link'

    App\Security\DiscordOAuthAuthenticator:
        arguments:
            $successHandler: '@security.authentication.success_handler.main.login_link'
            $failureHandler: '@security.authentication.failure_handler.main.login_link'

    App\Security\AlliedModdersOAuthAuthenticator:
        arguments:
            $successHandler: '@security.authentication.success_handler.main.login_link'
            $failureHandler: '@security.authentication.failure_handler.main.login_link'

    App\Controller\LegacySymbolsController:
        arguments:
            $symbolUploadToken: '%app.symbol_upload_token%'

    App\Legacy\LegacyBridgeFactory:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $legacyConfig: '%app.legacy%'
            $redisUrl: '%env(REDIS_URL)%'
