# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.name: 'Throttle'
    app.login_link_lifetime: 600
    app.auth_email_login_lifetime: 900
    app.auth_email_verify_lifetime: 86400
    app.auth_password_reset_lifetime: 3600
    app.admins_default: ''
    app.admins: '%env(default:app.admins_default:APP_ADMINS)%'
    app.symbol_upload_token: '%env(SYMBOL_UPLOAD_TOKEN)%'
    app.ai_settings_key_default: ''
    app.ai_settings_key: '%env(default:app.ai_settings_key_default:AI_SETTINGS_KEY)%'
    app.bootstrap_admin_login_default: ''
    app.bootstrap_admin_login: '%env(default:app.bootstrap_admin_login_default:BOOTSTRAP_ADMIN_LOGIN)%'
    app.bootstrap_admin_email_default: ''
    app.bootstrap_admin_email: '%env(default:app.bootstrap_admin_email_default:BOOTSTRAP_ADMIN_EMAIL)%'
    app.bootstrap_admin_password_default: ''
    app.bootstrap_admin_password: '%env(default:app.bootstrap_admin_password_default:BOOTSTRAP_ADMIN_PASSWORD)%'
    app.code_editor_default: ''
    app.mailer_dsn_default: 'null://null'
    app.mailer_dsn: '%env(default:app.mailer_dsn_default:MAILER_DSN)%'
    app.mailer_from_default: 'throttle@example.com'
    app.mailer_from: '%env(default:app.mailer_from_default:MAILER_FROM)%'
    app.steam_api_key_default: ''
    app.steam_api_key: '%env(default:app.steam_api_key_default:STEAM_API_KEY)%'
    app.oauth_discord_client_id_default: ''
    app.oauth_discord_client_id: '%env(default:app.oauth_discord_client_id_default:OAUTH_DISCORD_CLIENT_ID)%'
    app.oauth_discord_client_secret_default: ''
    app.oauth_discord_client_secret: '%env(default:app.oauth_discord_client_secret_default:OAUTH_DISCORD_CLIENT_SECRET)%'
    app.legacy:
        accelerator: ''
        apikey: false
        maintenance: ''
        show-version: false
        symbol-stores: ['public']
        symbol-upload-token: '%app.symbol_upload_token%'
        symbol-request:
            deny-path-prefixes: []
            deny-path-contains: []
            deny-exact: []
            deny-prefixes: []
            deny-suffixes: []
            allow-path-contains: []
            allow-exact: []
            allow-regex: []

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Silex/'
            - '../src/Throttle/'

    Throttle\Command\:
        resource: '../src/Throttle/Command/'
        autowire: true
        autoconfigure: true

    Throttle\Command\CrashProcessCommand:
        arguments:
            $legacyBridgeFactory: '@App\Legacy\LegacyBridgeFactory'
            $storageRetentionManager: '@App\Runtime\StorageRetentionManager'
            $crashDiscordWebhookDeliveryManager: '@App\Runtime\CrashDiscordWebhookDeliveryManager'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Security\UserManager:
        arguments:
            $loginLinkLifetime: '%app.login_link_lifetime%'

    App\Security\BootstrapAdminManager:
        arguments:
            $bootstrapLogin: '%app.bootstrap_admin_login%'
            $bootstrapEmail: '%app.bootstrap_admin_email%'
            $bootstrapPassword: '%app.bootstrap_admin_password%'

    App\Runtime\AuthTokenManager:
        arguments:
            $emailLoginLifetime: '%app.auth_email_login_lifetime%'
            $emailVerifyLifetime: '%app.auth_email_verify_lifetime%'
            $passwordResetLifetime: '%app.auth_password_reset_lifetime%'

    App\Runtime\AuthSettings:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Security\AuthMailer:
        arguments:
            $fromAddress: '%app.mailer_from%'

    App\Runtime\AuthEnvironment:
        arguments:
            $mailerDsn: '%app.mailer_dsn%'
            $mailerFrom: '%app.mailer_from%'
            $steamApiKey: '%app.steam_api_key%'
            $discordClientId: '%app.oauth_discord_client_id%'
            $discordClientSecret: '%app.oauth_discord_client_secret%'

    App\Security\ConfigAdminChecker:
        arguments:
            $adminUsers: '%app.admins%'

    # this isn't quite correct, but it works for now
    App\Security\SteamOpenIdAuthenticator:
        arguments:
            $successHandler: '@security.authentication.success_handler.main.login_link'
            $failureHandler: '@security.authentication.failure_handler.main.login_link'
            $steamApiKey: '%env(STEAM_API_KEY)%'

    App\Security\GitHubOAuthAuthenticator:
        arguments:
            $successHandler: '@security.authentication.success_handler.main.login_link'
            $failureHandler: '@security.authentication.failure_handler.main.login_link'

    App\Security\DiscordOAuthAuthenticator:
        arguments:
            $successHandler: '@security.authentication.success_handler.main.login_link'
            $failureHandler: '@security.authentication.failure_handler.main.login_link'

    App\Security\AlliedModdersOAuthAuthenticator:
        arguments:
            $successHandler: '@security.authentication.success_handler.main.login_link'
            $failureHandler: '@security.authentication.failure_handler.main.login_link'

    App\Controller\LegacySymbolsController:
        arguments:
            $symbolUploadToken: '%app.symbol_upload_token%'

    App\Controller\LegacyCrashController:
        arguments:
            $symbolUploadToken: '%app.symbol_upload_token%'

    App\Legacy\LegacyBridgeFactory:
        arguments:
            $userAiConfigManager: '@App\Runtime\UserAiConfigManager'
            $projectDir: '%kernel.project_dir%'
            $legacyConfig: '%app.legacy%'
            $redisUrl: '%env(REDIS_URL)%'

    App\Runtime\AiSettingsCrypto:
        arguments:
            $configuredKey: '%app.ai_settings_key%'
            $appSecret: '%kernel.secret%'

    App\Runtime\SymbolAdminManager:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Runtime\CrashSourceLookupManager:
        arguments:
            $projectDir: '%kernel.project_dir%'
