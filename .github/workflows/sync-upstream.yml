name: Sync upstream

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: 2026-mysql
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/MrPanica/throttle.git
          git fetch upstream 2026
          git fetch origin 2026

      - name: Check for new upstream commits
        id: check
        run: |
          FORK=$(git rev-parse origin/2026)
          UPSTREAM=$(git rev-parse upstream/2026)
          if [ "$FORK" = "$UPSTREAM" ]; then
            echo "new_commits=false" >> $GITHUB_OUTPUT
          else
            echo "new_commits=true" >> $GITHUB_OUTPUT
          fi

      - name: Update fork 2026 branch
        if: steps.check.outputs.new_commits == 'true'
        run: |
          git checkout -B 2026 origin/2026
          git merge upstream/2026
          git push origin 2026

      - name: Attempt merge into 2026-mysql
        if: steps.check.outputs.new_commits == 'true'
        id: merge
        run: |
          git checkout -B 2026-mysql origin/2026-mysql
          if git merge origin/2026 --no-commit --no-ff; then
            echo "conflict=false" >> $GITHUB_OUTPUT
          else
            echo "conflict=true" >> $GITHUB_OUTPUT
            git merge --abort
          fi

      - name: Push clean merge
        if: steps.check.outputs.new_commits == 'true' && steps.merge.outputs.conflict == 'false'
        run: |
          if git diff --cached --quiet; then
            echo "Already up to date, nothing to commit"
          else
            git commit -m "Merge upstream $(git rev-parse --short upstream/2026) into 2026-mysql"
            git push origin 2026-mysql
          fi

      - name: Open conflict PR
        if: steps.check.outputs.new_commits == 'true' && steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          BRANCH="mysql-conflict-$(date +%Y%m%d)"
          git checkout -b $BRANCH origin/2026-mysql
          git push origin $BRANCH
          HTTP_CODE=$(curl -s -o /tmp/pr_response.json -w "%{http_code}" -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/DNA-styx/throttle/pulls \
            -d "{\"title\":\"MySQL patch conflict - manual review required\",\"body\":\"Upstream changes on \`2026\` conflict with MySQL 8.4 patches in \`2026-mysql\`. Manual merge and re-application of patches required before deploying.\",\"head\":\"$BRANCH\",\"base\":\"2026-mysql\"}")
          if [ "$HTTP_CODE" != "201" ]; then
            echo "PR creation failed with HTTP $HTTP_CODE"
            cat /tmp/pr_response.json
            exit 1
          fi